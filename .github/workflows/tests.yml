name: Tests

# Runs on every push and pull request. Cheap enough to be automatic:
# ubuntu-latest bills at 1x (against windows 2x and macOS 10x), and on a
# public repository Actions is free outright. The desktop build stays
# manual in build.yml -- that one is expensive and produces artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: no point finishing a
# run against code that has already been replaced.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite is ~9 minutes on a fast local machine and about 25 on the
    # 2-core runner (it reached 82% at 20 minutes on 2026-09-12); this is a
    # stuck-job guard, not a target.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # Matches the venv the pins were resolved on and the interpreter
          # build.yml now uses. Keep the two workflows on the same version.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # requirements.txt is runtime + test only. The desktop/PyInstaller
        # extras live in requirements-desktop.txt and are not needed here --
        # nothing in tests/ imports desktop_launcher.
        run: pip install -r requirements.txt

      - name: Run the suite
        # AppTest runs Streamlit in-process: no browser, no server, no port.
        run: python -m pytest -q
