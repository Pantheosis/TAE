name: Build Desktop App

# Manual only. Start a build from the Actions tab -> "Build Desktop App" ->
# "Run workflow". Pushes to main deliberately do NOT trigger it: the desktop
# binaries are cut for releases, not for every commit, and building both
# platforms on each push burns Actions minutes on work nobody downloads.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false   # if the Windows build fails, still let macOS finish
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      # Windows: no manual zip here. actions/upload-artifact already wraps
      # whatever it's given in its own zip on download -- pre-zipping too
      # (as this workflow previously did) produced a zip-inside-a-zip.
      # Pointing it directly at the build folder means downloading gives
      # you exactly one zip to extract, with the .exe at the top level.

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          zip -r ../TraditionalAstrologyEngine-macos.zip TraditionalAstrologyEngine.app

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: TraditionalAstrologyEngine-${{ runner.os }}
          path: dist/TraditionalAstrologyEngine/
          retention-days: 7

      - name: Upload build artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: TraditionalAstrologyEngine-${{ runner.os }}
          # Uploaded as an already-zipped file rather than the raw .app --
          # GitHub's own artifact zipping doesn't reliably preserve the
          # executable bit and internal symlinks inside a macOS .app bundle,
          # so this still ends up double-zipped after download, but that's
          # the standard/accepted tradeoff for Mac specifically.
          path: TraditionalAstrologyEngine-macos.zip
          retention-days: 30
