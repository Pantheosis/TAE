name: Build Desktop App

# Runs when a release tag (v*) is pushed, and can be started by hand from the
# Actions tab. A push to main builds nothing: binaries are cut for releases,
# not for every commit -- building both platforms on each push burned Actions
# minutes and filled the account's storage with artifacts nobody downloaded.
#
# On a tag: the two zips are attached to a GitHub release for that tag on
# THIS repository, so the binary and the source it was built from are always
# the same page (the licence requires the corresponding source to be
# available with each binary). No artifacts are kept.
# On a manual run: the zips are kept as workflow artifacts for three days
# for testing, and no release is made.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # gh release create / upload

jobs:
  build:
    strategy:
      fail-fast: false   # if the Windows build fails, still let macOS finish
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # 3.14 to match the venv the pins were resolved on and the test
          # suite runs on. Keep the two workflows on the same version.
          python-version: '3.14'

      - name: Install dependencies
        run: |
          # requirements-desktop.txt includes requirements.txt, so the
          # binary is built against the same pins the tests run on.
          pip install -r requirements-desktop.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      # One zip per platform, the executable at the top level of the
      # folder it unpacks to. (Windows: the onedir folder zipped as a
      # whole; macOS: the .app bundle, zipped so its executable bits and
      # internal symlinks survive.)
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TraditionalAstrologyEngine -DestinationPath TraditionalAstrologyEngine-windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          zip -qr ../TraditionalAstrologyEngine-macos.zip TraditionalAstrologyEngine.app

      - name: Attach to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The first platform to finish creates the release; the second
          # finds it and only uploads. --clobber makes a re-run replace its
          # own asset rather than fail on it.
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Traditional Astrology Engine $tag" --generate-notes
          gh release upload "$tag" TraditionalAstrologyEngine-*.zip --clobber

      - name: Keep the zip for testing (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: TraditionalAstrologyEngine-${{ runner.os }}
          path: TraditionalAstrologyEngine-*.zip
          retention-days: 3
